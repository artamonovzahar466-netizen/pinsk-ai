

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinsk AI — Студия дизайна</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131c;color:#f5f6fa;font:15px Arial,sans-serif}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{padding:24px;background:#171c29;border-right:1px solid #30394d}
.logo{font-size:24px;font-weight:bold;margin-bottom:30px}.logo span{color:#9b87ff}
nav button,.tab,button{cursor:pointer;border:0;border-radius:9px;padding:11px 14px;background:#292f42;color:white;margin:4px}
nav button{display:block;width:100%;text-align:left;background:transparent}nav button.active,.tab.active{background:#5948b5}
main{padding:28px;max-width:1500px;width:100%;margin:auto}h1{margin-top:0}.muted{color:#aab2c4}
.tabs{margin:18px 0}.grid{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px}
.panel{background:#1b2231;border:1px solid #30394d;border-radius:14px;padding:18px}
label{display:block;color:#aab2c4;margin:14px 0 7px}textarea,select{width:100%;padding:12px;border-radius:9px;border:1px solid #3a4358;background:#111722;color:white}
textarea{min-height:130px;resize:vertical}.code{min-height:390px;font:12px monospace;white-space:pre}
.primary{background:#7962ed}.preview{width:100%;height:520px;background:white;border:0;border-radius:10px;margin-top:12px}
.hidden{display:none!important}.status{color:#aab2c4;min-height:22px;margin-top:10px}
.result{max-width:100%;max-height:520px;object-fit:contain}.actions{display:flex;flex-wrap:wrap;gap:6px}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0}nav{display:flex}nav button{width:auto}.grid{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<div class="layout"><aside><div class="logo">Pinsk <span>AI</span></div><nav><button class="active" data-page="home">Главная</button><button data-page="studio">Студия дизайна</button></nav></aside>
<main>
<section id="home"><h1>Добро пожаловать в Pinsk AI</h1><p class="muted">Создавай изображения и сайты с помощью искусственного интеллекта.</p><button class="primary" id="openStudio">Открыть студию</button></section>
<section id="studio" class="hidden"><h1>Студия дизайна</h1><p class="muted">Генерация изображений и создание веб-сайтов.</p>
<div class="tabs"><button class="tab active" data-mode="site">Создать сайт</button><button class="tab" data-mode="image">Создать изображение</button></div>
<div id="siteMode" class="grid"><div class="panel"><h3>Описание сайта</h3><label for="sitePrompt">Что нужно создать?</label><textarea id="sitePrompt" placeholder="Опиши сайт, его разделы, цвета и стиль..."></textarea><label for="siteStyle">Стиль</label><select id="siteStyle"><option>Современный минимализм</option><option>Премиальный</option><option>Яркий технологичный</option><option>Корпоративный</option><option>Креативный</option></select><div class="actions"><button class="primary" id="makeSite">Сгенерировать сайт</button><button id="clearSite">Очистить</button></div><div id="siteStatus" class="status"></div></div>
<div class="panel"><h3>HTML редактор</h3><textarea id="siteCode" class="code" placeholder="HTML-код появится здесь..."></textarea><div class="actions"><button id="refresh">Обновить предпросмотр</button><button id="downloadSite">Скачать HTML</button></div><iframe id="sitePreview" class="preview" title="Предпросмотр сайта" sandbox="allow-scripts"></iframe></div></div>
<div id="imageMode" class="grid hidden"><div class="panel"><h3>Создать изображение</h3><label for="imagePrompt">Описание</label><textarea id="imagePrompt" placeholder="Опиши желаемое изображение..."></textarea><label for="imageSize">Формат</label><select id="imageSize"><option value="1024x1024">Квадрат</option><option value="1024x1536">Вертикальный</option><option value="1536x1024">Горизонтальный</option></select><button class="primary" id="makeImage">Создать изображение</button><div id="imageStatus" class="status"></div></div><div class="panel"><h3>Результат</h3><img id="imageResult" class="result hidden" alt="Сгенерированное изображение"><a id="imageDownload" class="hidden" download="pinsk-ai-image.png">Скачать изображение</a></div></div>
</section></main></div><script src="/app.js" defer></script></body></html>
