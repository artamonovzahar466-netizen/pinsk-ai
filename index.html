<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <meta name="description" content="Pinsk AI — интеллектуальный ИИ-ассистент">
  <title>Pinsk AI</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">P</div>
        <span class="brand-name">Pinsk AI</span>
        <button id="closeSidebar" class="icon-button" aria-label="Закрыть меню">×</button>
      </div>

      <button id="newChatBtn" class="new-chat-btn">＋ Новый чат</button>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="chat">💬 Чат</button>
        <button class="nav-item" data-page="overview">◫ Обзор</button>
        <button class="nav-item" data-page="projects">▦ Проекты</button>
        <button class="nav-item" data-page="library">▤ Библиотека</button>
        <button class="nav-item" data-page="plugins">🧩 Плагины</button>
      </nav>

      <div class="sidebar-section-title">История чатов</div>
      <div id="chatHistory" class="chat-history"></div>

      <div class="sidebar-footer">
        <button id="settingsBtn" class="nav-item">⚙ Настройки</button>
        <button id="profileBtn" class="nav-item">👤 Профиль</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button id="openSidebar" class="icon-button" aria-label="Открыть меню">☰</button>
        <div class="topbar-title">Pinsk AI</div>
        <div class="topbar-actions">
          <button id="reasoningBtn" class="icon-button" title="Режим рассуждения">◈</button>
          <button id="languageBtn" class="icon-button" title="Язык">🌐</button>
        </div>
      </header>

      <section id="workspace" class="workspace">
        <div id="chatPage" class="page active">
          <div id="chatMessages" class="chat-messages">
            <div class="welcome-screen">
              <div class="welcome-logo">P</div>
              <h1>Чем могу помочь?</h1>
              <p>Спроси о чём угодно — начнём работу вместе.</p>
            </div>
          </div>

          <div class="composer-container">
            <div class="composer">
              <textarea id="messageInput" placeholder="Напишите сообщение..." rows="1"></textarea>
              <div class="composer-actions">
                <div class="composer-left">
                  <button id="attachBtn" class="icon-button" title="Прикрепить файл">＋</button>
                  <input id="fileInput" type="file" hidden multiple>
                </div>
                <div class="composer-right">
                  <button id="voiceBtn" class="icon-button" title="Голосовой ввод">🎙</button>
                  <button id="sendBtn" class="send-button" title="Отправить">↑</button>
                </div>
              </div>
            </div>
            <p class="composer-disclaimer">Pinsk AI может допускать ошибки. Проверяйте важную информацию.</p>
          </div>
        </div>

        <section id="overviewPage" class="page"></section>
        <section id="projectsPage" class="page"></section>
        <section id="libraryPage" class="page"></section>
        <section id="pluginsPage" class="page"></section>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="icon-button">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
